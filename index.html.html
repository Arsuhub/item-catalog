<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141519">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Item Catalog</title>
<style>
:root{
  --bg:#141519; --surface:#1d1f26; --surface2:#23262f; --line:#2d313c;
  --text:#f1efe7; --muted:#9aa0ab; --amber:#f0a52b; --amber-ink:#231a06;
  --teal:#3fb98c; --danger:#e2574a; --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100%;overscroll-behavior-y:contain}
#app{max-width:560px;margin:0 auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom));min-height:100vh}
h1{font-size:21px;margin:6px 0 2px;font-weight:650;letter-spacing:.2px}
h2{font-size:17px;margin:0;font-weight:600}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{display:inline-block;font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--amber);color:var(--amber-ink);padding:5px 14px;letter-spacing:.5px;
  clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 50%,100% 100%,7px 100%,0 50%);white-space:nowrap}
.tag.gray{background:#3a3e49;color:#d7dae2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:10px;cursor:pointer}
.card:active{background:var(--surface2)}
.card .meta{color:var(--muted);font-size:13px;margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);color:var(--text);font:600 16px system-ui,sans-serif;cursor:pointer}
.btn:active{filter:brightness(1.15)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.danger{color:#ff9d93;border-color:#5a322e}
.btn.small{min-height:42px;font-size:14.5px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px;margin:10px 0}
.btnrow .btn{flex:1}
.iconbtn{width:42px;min-width:42px;height:42px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hdr .title{flex:1;min-width:0}
.hdr .title h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.cell{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#0d0e11;
  border:1px solid var(--line);cursor:pointer}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .vid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:var(--muted);font-size:13px;gap:4px}
.cell .vid .tri{font-size:26px;color:var(--text)}
.cell .dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;
  background:var(--amber);border:2px solid rgba(0,0,0,.45)}
.cell .num{position:absolute;left:6px;bottom:5px;font:600 11px ui-monospace,monospace;
  color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px}
label.fld{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;color:var(--text);font:16px system-ui,sans-serif;padding:12px;outline:none}
textarea{min-height:72px;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:#4a5160}
.hint{color:var(--muted);font-size:12.5px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--teal);font-weight:600}
.badge.warn{color:var(--amber)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,21,25,.92);
  border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.bar .in{max-width:560px;margin:0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:#e9e6da;color:#1c1d22;font:600 14px system-ui,sans-serif;padding:10px 16px;
  border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:86%;text-align:center}
.toast.on{opacity:1}
.banner{background:#3a2e12;border:1px solid #6b5418;color:#f4d8a0;border-radius:var(--r);
  padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;
  align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;
  width:100%;max-width:560px;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:16.5px}
.sheet .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
  border:none;color:var(--text);font:500 16px system-ui,sans-serif;padding:14px 4px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.sheet .opt:last-of-type{border-bottom:none}
.sheet .opt.danger{color:#ff9d93}
.viewer{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column}
.viewer .stage{flex:1;overflow:hidden;position:relative;touch-action:none;display:flex;
  align-items:center;justify-content:center}
.viewer .stage img{max-width:100%;max-height:100%;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none}
.viewer .stage video{max-width:100%;max-height:100%}
.viewer .top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;
  padding-top:calc(10px + env(safe-area-inset-top));color:#fff;gap:8px}
.viewer .bot{padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(0,0,0,.6)}
.viewer .bot textarea{background:#15161a;border-color:#33363f;min-height:48px}
.viewer .navrow{display:flex;gap:10px;margin-top:8px}
.viewer .navrow .btn{background:#1b1c21;border-color:#33363f}
.logentry{border-bottom:1px solid var(--line);padding:10px 2px}
.logentry .when{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace}
.logentry .x{float:right;color:var(--muted);background:none;border:none;font-size:16px;cursor:pointer;padding:2px 6px}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:22px}
.foot a{color:var(--muted)}
.stamp{animation:stamp .45s ease}
@keyframes stamp{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:14.5px}
.menu-anchor{position:relative}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script id="appjs">
'use strict';

/* ---------- tiny utils ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=(n,w)=>String(n).padStart(w,'0');
const fmtDT=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)} ${pad(d.getHours(),2)}:${pad(d.getMinutes(),2)}`};
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'folder';
const mb=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- storage layer (IndexedDB with in-memory fallback) ---------- */
let db=null, persistent=true;
const mem={folders:new Map(),sets:new Map(),meta:new Map()};

function openDB(){return new Promise((res,rej)=>{
  let r;try{r=indexedDB.open('itemcatalog',1)}catch(e){rej(e);return}
  r.onupgradeneeded=e=>{const d=e.target.result;
    d.createObjectStore('folders',{keyPath:'id'});
    const s=d.createObjectStore('sets',{keyPath:'id'});
    s.createIndex('folder','folderId',{unique:false});
    d.createObjectStore('meta',{keyPath:'k'});};
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
  r.onblocked=()=>rej(new Error('blocked'));
})}

function dbReq(store,mode,fn){return new Promise((res,rej)=>{
  const t=db.transaction(store,mode);const o=t.objectStore(store);
  const rq=fn(o);
  rq.onsuccess=()=>res(rq.result);
  rq.onerror=()=>rej(rq.error);
})}
async function dGet(st,k){ if(!db)return mem[st].get(k)||null; return (await dbReq(st,'readonly',o=>o.get(k)))||null }
async function dPut(st,v){ if(!db){mem[st].set(v.id||v.k,v);return v} await dbReq(st,'readwrite',o=>o.put(v)); return v }
async function dDel(st,k){ if(!db){mem[st].delete(k);return} await dbReq(st,'readwrite',o=>o.delete(k)) }
async function dAll(st){ if(!db)return Array.from(mem[st].values()); return await dbReq(st,'readonly',o=>o.getAll()) }
async function dSetsIn(fid){ if(!db)return Array.from(mem.sets.values()).filter(s=>s.folderId===fid);
  return new Promise((res,rej)=>{const t=db.transaction('sets','readonly');
    const rq=t.objectStore('sets').index('folder').getAll(fid);
    rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)})}

async function nextSetId(){
  const d=new Date();const day=`${d.getFullYear()}${pad(d.getMonth()+1,2)}${pad(d.getDate(),2)}`;
  const k='ctr-'+day;const row=await dGet('meta',k);const n=(row?row.v:0)+1;
  await dPut('meta',{k,v:n});
  return `${day}-${pad(n,3)}`;
}

/* ---------- media helpers ---------- */
function extOf(m){
  const t=(m.type||'').toLowerCase();
  const map={'image/jpeg':'jpg','image/jpg':'jpg','image/png':'png','image/webp':'webp',
    'image/heic':'heic','image/heif':'heic','image/gif':'gif',
    'video/mp4':'mp4','video/webm':'webm','video/3gpp':'3gp','video/quicktime':'mov','video/x-matroska':'mkv'};
  if(map[t])return map[t];
  const nm=(m.name||'');const i=nm.lastIndexOf('.');
  if(i>0&&i<nm.length-1)return nm.slice(i+1).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';
  return t.startsWith('video')?'mp4':(t.startsWith('image')?'jpg':'bin');
}
async function makeThumb(blob){
  try{
    const bmp=await createImageBitmap(blob,{imageOrientation:'from-image'});
    const sc=Math.min(1,360/Math.max(bmp.width,bmp.height));
    const w=Math.max(1,Math.round(bmp.width*sc)),h=Math.max(1,Math.round(bmp.height*sc));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(bmp,0,0,w,h);
    if(bmp.close)bmp.close();
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.72));
  }catch(e){return null}
}

/* ---------- ZIP writer (STORE only — media is already compressed) ---------- */
const CRC_T=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c}
  return t})();
function crc32(u8){let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0}
function dosDT(d){
  const date=(((d.getFullYear()-1980)&0x7F)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  return{date,time}}
async function buildZip(entries){
  const te=new TextEncoder();const parts=[];const cd=[];let off=0;
  for(const e of entries){
    const data=new Uint8Array(await e.blob.arrayBuffer());
    const nm=te.encode(e.name);
    const crc=crc32(data);
    const {date,time}=dosDT(e.date instanceof Date?e.date:new Date());
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true);lh.setUint16(10,time,true);lh.setUint16(12,date,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,time,true);ch.setUint16(14,date,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,nm.length,true);
    ch.setUint32(42,off,true);
    cd.push(ch.buffer,nm);
    off+=30+nm.length+data.length;
  }
  let cdLen=0;for(const b of cd)cdLen+=(b.byteLength!==undefined?b.byteLength:b.length);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,entries.length,true);eo.setUint16(10,entries.length,true);
  eo.setUint32(12,cdLen,true);eo.setUint32(16,off,true);
  return new Blob([...parts,...cd,eo.buffer],{type:'application/zip'});
}

/* ---------- export bundles ---------- */
function mediaFileNames(set){
  let p=0,v=0;return set.media.map(m=>m.kind==='video'?`${set.id}_v${++v}.${extOf(m)}`:`${set.id}_${++p}.${extOf(m)}`)
}
function setEntries(set,folder){
  const names=mediaFileNames(set);
  const ents=set.media.map((m,i)=>({name:`${set.id}/${names[i]}`,blob:m.blob,date:new Date(set.createdAt)}));
  const photos=set.media.filter(m=>m.kind!=='video').length;
  const vids=set.media.length-photos;
  let txt=`Set ${set.id}\nFolder: ${folder.name}\nCreated: ${fmtDT(set.createdAt)}\nFiles: ${photos} photo(s), ${vids} video(s)\n\nSet note:\n${set.note?set.note:'(none)'}\n`;
  const fnotes=set.media.map((m,i)=>m.note?`${names[i]} — ${m.note}`:null).filter(Boolean);
  txt+=`\nFile notes:\n${fnotes.length?fnotes.join('\n'):'(none)'}\n`;
  const meta={app:'ItemCatalog v1',id:set.id,folder:folder.name,createdAt:new Date(set.createdAt).toISOString(),
    note:set.note||'',exportedAt:new Date().toISOString(),
    files:set.media.map((m,i)=>({name:names[i],kind:m.kind,type:m.type||'',bytes:m.blob.size,note:m.note||''}))};
  ents.push({name:`${set.id}/${set.id}_notes.txt`,blob:new Blob([txt],{type:'text/plain'}),date:new Date()});
  ents.push({name:`${set.id}/${set.id}_meta.json`,blob:new Blob([JSON.stringify(meta,null,2)],{type:'application/json'}),date:new Date()});
  return ents;
}
function folderExtras(folder){
  const ents=[];
  if(folder.log&&folder.log.length){
    const txt=folder.log.slice().sort((a,b)=>a.ts-b.ts).map(e=>`${fmtDT(e.ts)} — ${e.text}`).join('\n')+'\n';
    ents.push({name:'log.txt',blob:new Blob([txt],{type:'text/plain'}),date:new Date()});
  }
  ents.push({name:'folder.json',blob:new Blob([JSON.stringify({app:'ItemCatalog v1',folder:folder.name,
    exportedAt:new Date().toISOString(),log:(folder.log||[]).map(e=>({at:new Date(e.ts).toISOString(),text:e.text}))},null,2)],
    {type:'application/json'}),date:new Date()});
  return ents;
}
async function deliver(blob,name,mode){
  const f=new File([blob],name,{type:'application/zip'});
  if(mode==='share'){
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:name});return 'shared'}
      catch(e){if(e&&e.name==='AbortError')return null; }
    }else{
      toast('Sharing needs the app to run over https — saving to Downloads instead');
    }
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  return 'saved';
}
async function exportSets(sets,folder,mode){
  if(!sets.length){toast('Nothing to export');return}
  busy(true,'Packing '+(sets.length>1?sets.length+' sets…':sets[0].id+'…'));
  try{
    let ents=[];for(const s of sets)ents=ents.concat(setEntries(s,folder));
    let name;
    if(sets.length===1){name=`${slug(folder.name)}_${sets[0].id}.zip`}
    else{ents=ents.concat(folderExtras(folder));
      const d=new Date();name=`${slug(folder.name)}_${d.getFullYear()}${pad(d.getMonth()+1,2)}${pad(d.getDate(),2)}-${pad(d.getHours(),2)}${pad(d.getMinutes(),2)}.zip`}
    const zip=await buildZip(ents);
    busy(false);
    const r=await deliver(zip,name,mode);
    if(r){const now=Date.now();
      for(const s of sets){s.exportedAt=now;await dPut('sets',s)}
      toast(r==='shared'?'Shared — sets marked exported':'Saved to Downloads — sets marked exported');
      render();
    }
  }catch(e){busy(false);console.error(e);toast('Export failed: '+(e&&e.message?e.message:e))}
}

/* ---------- navigation ---------- */
const state={stack:[{screen:'home'}]};
let viewer=null; // {set, idx, urls:[]}
let urls=[]; // object URLs for current screen
function cur(){return state.stack[state.stack.length-1]}
function go(s){state.stack.push(s);try{history.pushState({n:state.stack.length},'')}catch(e){};render()}
function back(){try{history.back()}catch(e){popNav()}}
function popNav(){if(viewer){closeViewer();return}
  if(state.stack.length>1)state.stack.pop();render()}
window.addEventListener('popstate',popNav);

function freeUrls(){for(const u of urls)URL.revokeObjectURL(u);urls=[]}
function ou(blob){const u=URL.createObjectURL(blob);urls.push(u);return u}

/* ---------- modal helpers ---------- */
function sheet(html){return new Promise(res=>{
  const w=document.createElement('div');w.className='sheetwrap';
  w.innerHTML=`<div class="sheet">${html}</div>`;
  document.body.appendChild(w);
  w.addEventListener('click',e=>{if(e.target===w){w.remove();res({act:null})}});
  w.resolve=v=>{w.remove();res(v)};
  window.__sheet=w;
})}
function sheetDone(v){if(window.__sheet){window.__sheet.resolve(v);window.__sheet=null}}
async function ask(title,placeholder,value){
  const p=sheet(`<h3>${esc(title)}</h3>
    <input type="text" id="askin" placeholder="${esc(placeholder||'')}" value="${esc(value||'')}">
    <div class="btnrow"><button class="btn small" onclick="sheetDone({act:null})">Cancel</button>
    <button class="btn small primary" onclick="sheetDone({act:'ok',v:document.getElementById('askin').value})">OK</button></div>`);
  setTimeout(()=>{const i=$('#askin');if(i){i.focus()}},60);
  const r=await p;return r.act==='ok'?(r.v||'').trim():null;
}
async function confirmBox(msg,okLabel){
  const r=await sheet(`<h3>${esc(msg)}</h3>
    <div class="btnrow"><button class="btn small" onclick="sheetDone({act:null})">Cancel</button>
    <button class="btn small danger" onclick="sheetDone({act:'ok'})">${esc(okLabel||'Yes')}</button></div>`);
  return r.act==='ok';
}
let busyEl=null;
function busy(on,msg){
  if(on){if(!busyEl){busyEl=document.createElement('div');busyEl.className='sheetwrap';
    busyEl.innerHTML=`<div class="sheet"><h3 id="busymsg"></h3><div class="hint">Keep the app open…</div></div>`;
    document.body.appendChild(busyEl)}
    $('#busymsg',busyEl).textContent=msg||'Working…'}
  else if(busyEl){busyEl.remove();busyEl=null}
}

/* ---------- data ops ---------- */
async function ensureDefaults(){
  const fs=await dAll('folders');
  if(!fs.length){await dPut('folders',{id:'f'+Date.now(),name:'Items',createdAt:Date.now(),log:[]})}
}
async function newFolder(){
  const name=await ask('New folder','e.g. Garage, Books, For sale');
  if(!name)return;
  await dPut('folders',{id:'f'+Date.now()+Math.random().toString(36).slice(2,6),name,createdAt:Date.now(),log:[]});
  render();
}
async function newSet(folderId){
  const id=await nextSetId();
  const set={id,folderId,createdAt:Date.now(),note:'',status:'open',exportedAt:null,media:[]};
  await dPut('sets',set);
  go({screen:'set',setId:id});
}
function pickMedia(setId,kind,opts){
  const i=document.createElement('input');i.type='file';
  i.accept=kind==='video'?'video/*':'image/*';
  if(opts&&opts.gallery){i.accept='image/*,video/*';i.multiple=true}
  else i.setAttribute('capture','environment');
  i.style.display='none';document.body.appendChild(i);
  i.onchange=async()=>{
    const files=Array.from(i.files||[]);i.remove();
    if(!files.length)return;
    const set=await dGet('sets',setId);if(!set)return;
    busy(true,'Adding '+files.length+' file(s)…');
    for(const f of files){
      const k=(f.type||'').startsWith('video')?'video':'photo';
      const m={kind:k,type:f.type||'',name:f.name||'',note:'',blob:f,thumb:null,addedAt:Date.now()};
      if(k==='photo')m.thumb=await makeThumb(f);
      set.media.push(m);
    }
    await dPut('sets',set);busy(false);render();
  };
  i.click();
}

/* ---------- views ---------- */
async function render(){
  freeUrls();
  const c=cur();
  if(c.screen==='home')await vHome();
  else if(c.screen==='folder')await vFolder(c.folderId);
  else if(c.screen==='set')await vSet(c.setId);
  else if(c.screen==='log')await vLog(c.folderId);
  window.scrollTo(0,c._sy||0);
}

async function vHome(){
  const folders=(await dAll('folders')).sort((a,b)=>a.createdAt-b.createdAt);
  const sets=await dAll('sets');
  let est='';try{const e=await navigator.storage.estimate();if(e&&e.usage)est=`Using ${mb(e.usage)} on this phone`}catch(e){}
  const cards=folders.map(f=>{
    const ss=sets.filter(s=>s.folderId===f.id);
    const drafts=ss.filter(s=>s.status==='open').length;
    const fresh=ss.filter(s=>s.status==='done'&&!s.exportedAt).length;
    const bits=[`${ss.length} set${ss.length===1?'':'s'}`];
    if(fresh)bits.push(`<span class="badge warn">● ${fresh} to export</span>`);
    if(drafts)bits.push(`${drafts} draft${drafts===1?'':'s'}`);
    return `<div class="card" data-open="${f.id}">
      <div class="spread"><h2>${esc(f.name)}</h2><span style="color:var(--muted)">›</span></div>
      <div class="meta">${bits.join(' · ')}</div></div>`;
  }).join('');
  $('#app').innerHTML=`
    ${persistent?'':`<div class="banner"><b>Preview mode — nothing is kept.</b> Open this app on your phone over https (see Guide) to get the permanent library.</div>`}
    <h1>Item Catalog</h1>
    <p class="sub">Shoot · group · tag · transfer</p>
    ${cards||'<div class="empty">No folders yet</div>'}
    <div class="btnrow"><button class="btn" id="bNewFolder">＋ Create folder</button></div>
    <div class="foot">${est}${est?' · ':''}<a href="#" id="bGuide">Guide</a></div>`;
  $$('#app [data-open]').forEach(el=>el.onclick=()=>go({screen:'folder',folderId:el.dataset.open}));
  $('#bNewFolder').onclick=newFolder;
  $('#bGuide').onclick=e=>{e.preventDefault();showGuide()};
}

async function vFolder(fid){
  const folder=await dGet('folders',fid);
  if(!folder){state.stack=[{screen:'home'}];return render()}
  let sets=await dSetsIn(fid);
  sets.sort((a,b)=>(a.status==='open'?0:1)-(b.status==='open'?0:1)||b.createdAt-a.createdAt);
  const fresh=sets.filter(s=>s.status==='done'&&!s.exportedAt);
  const cards=sets.map(s=>{
    const ph=s.media.find(m=>m.kind==='photo'&&m.thumb);
    const tcell=ph?`<img src="${ou(ph.thumb)}" alt="">`:
      (s.media.length?`<div class="vid"><span class="tri">▶</span>${s.media[0].kind==='video'?'video':'photo'}</div>`:`<div class="vid">empty</div>`);
    const photos=s.media.filter(m=>m.kind==='photo').length;
    const vids=s.media.length-photos;
    const bits=[`${photos}p${vids?` · ${vids}v`:''}`];
    if(s.status==='open')bits.push('<span class="badge warn">draft — tap to resume</span>');
    else if(s.exportedAt)bits.push('<span class="badge">✓ exported</span>');
    else bits.push('<span class="badge warn">● not exported</span>');
    return `<div class="card" data-set="${s.id}">
      <div class="row">
        <div class="cell" style="width:64px;min-width:64px;aspect-ratio:1">${tcell}</div>
        <div style="flex:1;min-width:0">
          <span class="tag">${esc(s.id)}</span>
          <div class="meta">${bits.join(' · ')}</div>
          ${s.note?`<div class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.note)}</div>`:''}
        </div></div></div>`;
  }).join('');
  $('#app').innerHTML=`
    <div class="hdr">
      <button class="iconbtn" id="bBack">‹</button>
      <div class="title"><h2>${esc(folder.name)}</h2>
        <div class="meta" style="color:var(--muted);font-size:12.5px">${sets.length} set${sets.length===1?'':'s'}${fresh.length?` · ${fresh.length} to export`:''}</div></div>
      <button class="iconbtn" id="bLog" title="Folder log">✎</button>
      <button class="iconbtn" id="bMenu">⋯</button>
    </div>
    ${cards||'<div class="empty">No sets yet — tap “New set” to start the first item.</div>'}
    <div class="bar"><div class="in">
      <button class="btn primary" id="bNewSet">＋ New set</button>
      <div class="btnrow" style="margin-bottom:0">
        <button class="btn small" id="bShareNew" ${fresh.length?'':'disabled'}>Share new (${fresh.length})</button>
        <button class="btn small" id="bSaveNew" ${fresh.length?'':'disabled'}>Save new (${fresh.length})</button>
      </div></div></div>`;
  $('#bBack').onclick=back;
  $('#bNewSet').onclick=()=>newSet(fid);
  $('#bLog').onclick=()=>go({screen:'log',folderId:fid});
  $('#bShareNew').onclick=()=>exportSets(fresh,folder,'share');
  $('#bSaveNew').onclick=()=>exportSets(fresh,folder,'save');
  $$('#app [data-set]').forEach(el=>el.onclick=()=>go({screen:'set',setId:el.dataset.set}));
  $('#bMenu').onclick=async()=>{
    const done=sets.filter(s=>s.status==='done');
    const exported=sets.filter(s=>s.exportedAt);
    const r=await sheet(`<h3>${esc(folder.name)}</h3>
      <button class="opt" onclick="sheetDone({act:'shareall'})">Share all sets (${done.length})</button>
      <button class="opt" onclick="sheetDone({act:'saveall'})">Save all sets to Downloads (${done.length})</button>
      <button class="opt" onclick="sheetDone({act:'rename'})">Rename folder</button>
      <button class="opt danger" onclick="sheetDone({act:'clear'})">Delete exported sets (${exported.length})</button>
      <button class="opt danger" onclick="sheetDone({act:'delfolder'})">Delete folder</button>`);
    if(r.act==='shareall')exportSets(done,folder,'share');
    else if(r.act==='saveall')exportSets(done,folder,'save');
    else if(r.act==='rename'){const n=await ask('Rename folder','',folder.name);if(n){folder.name=n;await dPut('folders',folder);render()}}
    else if(r.act==='clear'){
      if(!exported.length){toast('No exported sets to clear');return}
      if(await confirmBox(`Delete ${exported.length} exported set(s) from the phone? The copies you exported are not affected.`,'Delete')){
        for(const s of exported)await dDel('sets',s.id);toast('Cleared');render()}}
    else if(r.act==='delfolder'){
      if(sets.length){toast('Folder not empty — export & clear sets first');return}
      if(await confirmBox(`Delete folder “${folder.name}”?`,'Delete')){await dDel('folders',fid);back()}}
  };
}

async function vSet(sid){
  const set=await dGet('sets',sid);
  if(!set){state.stack=[{screen:'home'}];return render()}
  const folder=await dGet('folders',set.folderId);
  const open=set.status==='open';
  const cells=set.media.map((m,i)=>{
    const inner=m.kind==='photo'
      ?(m.thumb?`<img src="${ou(m.thumb)}" alt="">`:`<div class="vid">photo<br>(${esc(extOf(m))})</div>`)
      :`<div class="vid"><span class="tri">▶</span>video</div>`;
    return `<div class="cell" data-view="${i}">${inner}${m.note?'<span class="dot"></span>':''}
      <span class="num">${m.kind==='video'?'v':''}${i+1}</span></div>`;
  }).join('');
  $('#app').innerHTML=`
    <div class="hdr">
      <button class="iconbtn" id="bBack">‹</button>
      <div class="title">
        <span class="tag ${open?'':'gray'}" id="idtag">${esc(set.id)}</span>
        <div class="meta" style="color:var(--muted);font-size:12.5px;margin-top:3px">
          ${esc(folder?folder.name:'')} · ${fmtDT(set.createdAt)}
          ${set.exportedAt?' · <span class="badge">✓ exported</span>':''}</div>
      </div>
      <button class="iconbtn" id="bMenu">⋯</button>
    </div>
    <div class="grid">${cells}</div>
    ${set.media.length?'':'<div class="empty">No photos yet — use the buttons below.<br>Camera opens, you shoot, you’re back here.</div>'}
    <div class="btnrow">
      <button class="btn" id="bPhoto">📷 Add photo</button>
      <button class="btn" id="bVideo">🎥 Add video</button>
    </div>
    <div class="btnrow"><button class="btn small" id="bGallery">Pick from gallery…</button></div>
    <label class="fld">Set note</label>
    <textarea id="setnote" placeholder="Type, or tap the mic key on your keyboard to dictate">${esc(set.note)}</textarea>
    <div class="hint">Tap a photo to view it full screen, zoom, and add a note to that photo.</div>
    <div class="bar"><div class="in">
      ${open
        ?`<button class="btn primary" id="bDone" ${set.media.length?'':'disabled'}>✓ Complete set</button>`
        :`<div class="btnrow" style="margin:0">
            <button class="btn small primary" id="bShare">Share set</button>
            <button class="btn small" id="bSave">Save to Downloads</button>
          </div>`}
    </div></div>`;
  $('#bBack').onclick=back;
  $('#bPhoto').onclick=()=>pickMedia(sid,'photo');
  $('#bVideo').onclick=()=>pickMedia(sid,'video');
  $('#bGallery').onclick=()=>pickMedia(sid,null,{gallery:true});
  $('#setnote').onchange=async e=>{const s=await dGet('sets',sid);if(s){s.note=e.target.value;await dPut('sets',s)}};
  $$('#app [data-view]').forEach(el=>el.onclick=()=>openViewer(sid,+el.dataset.view));
  if(open){$('#bDone').onclick=async()=>{
    const s=await dGet('sets',sid);if(!s||!s.media.length)return;
    s.note=$('#setnote').value;s.status='done';await dPut('sets',s);
    const t=$('#idtag');t.classList.add('stamp');
    toast('Set '+s.id+' complete');
    setTimeout(back,420);
  }}else{
    $('#bShare').onclick=async()=>exportSets([await dGet('sets',sid)],folder,'share');
    $('#bSave').onclick=async()=>exportSets([await dGet('sets',sid)],folder,'save');
  }
  $('#bMenu').onclick=async()=>{
    const r=await sheet(`<h3>Set ${esc(set.id)}</h3>
      ${open?'':`<button class="opt" onclick="sheetDone({act:'reopen'})">Reopen (add more / edit)</button>`}
      <button class="opt" onclick="sheetDone({act:'move'})">Move to another folder…</button>
      <button class="opt danger" onclick="sheetDone({act:'del'})">Delete set</button>`);
    if(r.act==='reopen'){const s=await dGet('sets',sid);s.status='open';await dPut('sets',s);render()}
    else if(r.act==='move'){
      const fs=(await dAll('folders')).filter(f=>f.id!==set.folderId);
      if(!fs.length){toast('No other folders yet');return}
      const r2=await sheet(`<h3>Move to…</h3>${fs.map(f=>`<button class="opt" onclick="sheetDone({act:'${f.id}'})">${esc(f.name)}</button>`).join('')}`);
      if(r2.act){const s=await dGet('sets',sid);s.folderId=r2.act;await dPut('sets',s);toast('Moved');back()}}
    else if(r.act==='del'){
      if(await confirmBox('Delete this set and its photos from the phone?','Delete')){
        await dDel('sets',sid);back()}}
  };
}

async function vLog(fid){
  const folder=await dGet('folders',fid);
  if(!folder){state.stack=[{screen:'home'}];return render()}
  folder.log=folder.log||[];
  const rows=folder.log.slice().sort((a,b)=>b.ts-a.ts).map((e,i)=>`
    <div class="logentry"><button class="x" data-x="${e.ts}">✕</button>
      <div class="when">${fmtDT(e.ts)}</div><div>${esc(e.text)}</div></div>`).join('');
  $('#app').innerHTML=`
    <div class="hdr"><button class="iconbtn" id="bBack">‹</button>
      <div class="title"><h2>${esc(folder.name)} — log</h2>
      <div class="meta" style="color:var(--muted);font-size:12.5px">Rolling notes for this folder. Exports as log.txt.</div></div></div>
    <textarea id="logIn" placeholder="Add an entry — type or dictate with the mic key"></textarea>
    <div class="btnrow"><button class="btn primary small" id="bAdd">Add entry</button></div>
    ${rows||'<div class="empty">No entries yet</div>'}`;
  $('#bBack').onclick=back;
  $('#bAdd').onclick=async()=>{
    const v=$('#logIn').value.trim();if(!v)return;
    const f=await dGet('folders',fid);f.log=f.log||[];
    f.log.push({ts:Date.now(),text:v});await dPut('folders',f);render()};
  $$('#app [data-x]').forEach(el=>el.onclick=async()=>{
    const f=await dGet('folders',fid);f.log=(f.log||[]).filter(e=>String(e.ts)!==el.dataset.x);
    await dPut('folders',f);render()});
}

/* ---------- full-screen viewer with pinch zoom ---------- */
async function openViewer(sid,idx){
  const set=await dGet('sets',sid);if(!set||!set.media.length)return;
  viewer={sid,idx,urls:[]};
  try{history.pushState({v:1},'')}catch(e){}
  drawViewer(set);
}
function vUrl(b){const u=URL.createObjectURL(b);viewer.urls.push(u);return u}
async function drawViewer(setIn){
  const set=setIn||await dGet('sets',viewer.sid);
  const m=set.media[viewer.idx];if(!m){closeViewer();return}
  let el=$('#viewer');
  if(!el){el=document.createElement('div');el.id='viewer';el.className='viewer';document.body.appendChild(el)}
  for(const u of viewer.urls)URL.revokeObjectURL(u);viewer.urls=[];
  const names=mediaFileNames(set);
  const media=m.kind==='photo'
    ?(extOf(m)==='heic'?`<div style="color:#aaa;text-align:center;padding:20px">HEIC photo — stored & exported fine,<br>but this browser can’t preview it.<br><span class="hint">Tip: set camera to JPEG for previews.</span></div>`
      :`<img id="vimg" src="${vUrl(m.blob)}" alt="">`)
    :`<video src="${vUrl(m.blob)}" controls playsinline></video>`;
  el.innerHTML=`
    <div class="top">
      <span class="tag">${esc(names[viewer.idx])}</span>
      <span style="flex:1"></span>
      <button class="iconbtn" id="vDel" style="background:#26181a;border-color:#5a322e">🗑</button>
      <button class="iconbtn" id="vClose">✕</button>
    </div>
    <div class="stage" id="stage">${media}</div>
    <div class="bot">
      <textarea id="vnote" placeholder="Note for this ${m.kind} — type or dictate">${esc(m.note)}</textarea>
      <div class="navrow">
        <button class="btn small" id="vPrev" ${viewer.idx>0?'':'disabled'}>‹ Prev</button>
        <button class="btn small" id="vNext" ${viewer.idx<set.media.length-1?'':'disabled'}>Next ›</button>
      </div></div>`;
  $('#vClose').onclick=()=>back();
  $('#vPrev').onclick=()=>{viewer.idx--;drawViewer()};
  $('#vNext').onclick=()=>{viewer.idx++;drawViewer()};
  $('#vnote').onchange=async e=>{const s=await dGet('sets',viewer.sid);
    if(s&&s.media[viewer.idx]){s.media[viewer.idx].note=e.target.value;await dPut('sets',s)}};
  $('#vDel').onclick=async()=>{
    if(await confirmBox('Delete this '+m.kind+' from the set?','Delete')){
      const s=await dGet('sets',viewer.sid);s.media.splice(viewer.idx,1);await dPut('sets',s);
      if(!s.media.length){back();return}
      viewer.idx=Math.min(viewer.idx,s.media.length-1);drawViewer()}};
  const img=$('#vimg');if(img)pinchify(img,$('#stage'));
}
function closeViewer(){
  const el=$('#viewer');if(el)el.remove();
  if(viewer){for(const u of viewer.urls)URL.revokeObjectURL(u)}
  viewer=null;render();
}
function pinchify(img,stage){
  let s=1,tx=0,ty=0;const pts=new Map();let start=null;
  const apply=()=>{img.style.transform=`translate(${tx}px,${ty}px) scale(${s})`};
  img.style.transformOrigin='0 0';
  const dist=()=>{const p=[...pts.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};
  const mid=()=>{const p=[...pts.values()];return{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}};
  stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    start={s,tx,ty,d:pts.size===2?dist():0,m:pts.size===2?mid():{x:e.clientX,y:e.clientY}}});
  stage.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&start.d){
      const k=Math.min(6,Math.max(1,start.s*dist()/start.d));
      const mm=mid();
      tx=mm.x-(start.m.x-start.tx)*(k/start.s);
      ty=mm.y-(start.m.y-start.ty)*(k/start.s);
      s=k;apply();
    }else if(pts.size===1&&s>1){
      const p=[...pts.values()][0];
      tx=start.tx+(p.x-start.m.x);ty=start.ty+(p.y-start.m.y);apply();
    }});
  const up=e=>{pts.delete(e.pointerId);
    if(s<=1.02){s=1;tx=0;ty=0;apply()}
    if(pts.size===1){const p=[...pts.values()][0];start={s,tx,ty,d:0,m:{x:p.x,y:p.y}}}};
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  let lastTap=0;
  stage.addEventListener('pointerdown',e=>{const now=Date.now();
    if(now-lastTap<280&&pts.size===1){
      if(s>1){s=1;tx=0;ty=0}else{s=2.5;tx=e.clientX*(1-2.5);ty=e.clientY*(1-2.5)}
      apply()}
    lastTap=now});
}

/* ---------- guide ---------- */
function showGuide(){
  sheet(`<h3>How this works</h3>
  <div style="font-size:14.5px;color:#d8dbe2;max-height:62vh;overflow:auto;line-height:1.55">
  <p><b>Capture.</b> Open a folder → <b>New set</b> → Add photo. Your phone’s own camera opens at full quality; each shot returns here. Add a video or a dictated note if useful, then <b>Complete set</b> — the set is stamped with its ID (date-counter, e.g. 20260612-003). These photos stay out of your normal gallery.</p>
  <p><b>Notes & dictation.</b> Every note box works with the microphone key on your keyboard — tap it and talk. Notes are saved per set and per photo, and export in both plain-text and machine-readable form for AI processing later.</p>
  <p><b>Export.</b> “Share” opens Android’s share sheet — pick Quick Share (to Windows), LocalSend, or anything else. “Save to Downloads” drops the ZIP in your Downloads folder (good for a Syncthing-watched folder). Each set exports as ID-named files + notes; folder exports add the folder log. Sets are marked ✓ exported; use the folder menu to delete exported sets and free space. Tip: for sets with long videos, export set-by-set.</p>
  <p><b>Install.</b> In the browser menu choose <b>Add to home screen</b> for an app-like icon. The page itself works fully offline; sharing requires it to be served over https.</p>
  <p><b>Formats.</b> JPEG previews best — if your camera saves HEIC, files still store/export fine but won’t preview in the app. Keep single exports under ~1 GB.</p>
  </div>
  <div class="btnrow"><button class="btn small primary" onclick="sheetDone({act:null})">Close</button></div>`);
}

  try{history.replaceState({n:1},'')}catch(e){}

})();
